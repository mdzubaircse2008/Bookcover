<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Cover</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Georgia', serif;
    }

    .book-cover {
      width: 400px;
      height: 600px;
      background: rgb(185, 178, 180);
      border: 2px solid #9f9f98;
      padding: 40px 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #2e2e2e;
      text-align: center;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
      font-style: italic;
    }

    .image {
      flex: 2;
      background: url('https://th.bing.com/th/id/OIP.VgT6roFv_oyQR4T4feFoHQHaEK?w=331&h=186&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3') center/contain no-repeat;
      margin: 120px 0;
    }

    .author {
      font-size: 18px;
      text-align: center;
      color: #080808;
      margin-top: 20px;
    }

    .line {
      height: 2px;
      background: #333;
      width: 90px;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <div class="book-cover">
    <div>
      <div class="title">The Unsung King of Fallen Kingdom</div>
      <div class="line"></div>
      <div class="subtitle">The Story of The soulhearted King</div>
    </div>
            <div class="image">
        <img src="https://th.bing.com/th/id/OIP.VgT6roFv_oyQR4T4feFoHQHaEK?w=331&h=186&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" length="10%" width="100%">
    </div>
    <div class="author">By Zubair</div>
  </div>
</body>
</html>
